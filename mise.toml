[settings]
cache_prune_age = "7d"

[bootstrap.packages]
"brew:git" = "latest"
"brew:zoxide" = "latest"
"brew:eza" = "latest"
"brew:ripgrep" = "latest"
"brew:fd" = "latest"
"brew:bat" = "latest"
"brew:jq" = "latest"
"brew:fzf" = "latest"
"brew:mise" = "latest"
"brew:usage" = "latest"
"brew:fastfetch" = "latest"
"brew:dua-cli" = "latest"
"brew:herdr" = "latest"
"brew:rtk" = "latest"
"brew:neovim" = "latest"
"brew:node" = "latest"
"brew:python@3.14" = "latest"
"brew:rustup" = "latest"
"brew:pi-coding-agent" = "latest"

[dotfiles]
"~/.bash_profile" = "dotfiles/home/bash_profile"
"~/.bashrc" = "dotfiles/home/bashrc"
"~/.zshrc" = "dotfiles/home/zshrc"
"~/.zprofile" = "dotfiles/home/zprofile"
"~/.zshenv" = "dotfiles/home/zshenv"
"~/.p10k.zsh" = "dotfiles/home/p10k.zsh"
"~/.tmux.conf" = "dotfiles/home/tmux.conf"
"~/.agents" = { source = "dotfiles/agents", mode = "symlink-each" }
"~/.local/bin" = { source = "dotfiles/local-bin", mode = "symlink-each" }
"~/.config" = { source = "dotfiles/config", mode = "symlink-each", exclude = [
  "nvim",
  "shell",
  "ghostty",
] }
"~/.config/nvim" = "dotfiles/config/nvim"
"~/.config/shell" = { source = "dotfiles/config/shell", mode = "symlink-each" }
"~/.config/ghostty" = { source = "dotfiles/config/ghostty", mode = "symlink-each" }
"~/.config/mise/config.toml" = "mise.toml"

[bootstrap.hooks.pre-dotfiles]
run = """
mkdir -p \"$HOME/.local/bin\"
"""

[bootstrap.hooks.post-dotfiles]
run = """
ln -sf ~/.agents/AGENTS.md ~/.pi/agent/AGENTS.md
"""

[bootstrap.hooks.post-packages]
run = """
rtk init -g --agent pi
"""

[tasks.os-bootstrap]
hide = true
run = ":"

[tasks.bootstrap]
description = "Install shared agent skills and Pi packages"
depends = ["os-bootstrap"]
run = [{ task = "add-universal-skills" }, { task = "add-pi-extension" }]

[tasks.add-universal-skills]
description = "Install shared agent skills"
env.AGENT_SKILLS = """
JuliusBrussee/caveman --skill caveman
mattpocock/skills --skill grill-with-docs --skill domain-modeling --skill tdd --skill research
obra/superpowers --skill brainstorming --skill executing-plans --skill subagent-driven-development --skill writing-plans
"""
run = "{{ cwd | quote }}/scripts/add-universal-skills.sh"

[tasks.add-pi-extension]
description = "Install Pi packages"
env.PI_PACKAGES = """
npm:pi-web-access
npm:@tintinweb/pi-subagents
git:github.com/DietrichGebert/ponytail
"""
run = "{{ cwd | quote }}/scripts/add-pi-extension.sh"
