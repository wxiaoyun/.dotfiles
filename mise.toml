[settings]
cache_prune_age = "7d"

[bootstrap.packages]
"brew:git" = "latest"
"brew:zoxide" = "latest"
"brew:eza" = "latest"
"brew:ripgrep" = "latest"
"brew:fd" = "latest"
"brew:bat" = "latest"
"brew:jq" = "latest"
"brew:fzf" = "latest"
"brew:mise" = "latest"
"brew:usage" = "latest"
"brew:fastfetch" = "latest"
"brew:dua-cli" = "latest"
"brew:herdr" = "latest"
"brew:rtk" = "latest"
"brew:neovim" = "latest"
"brew:node" = "latest"
"brew:python@3.14" = "latest"
"brew:rustup" = "latest"
"brew:pi-coding-agent" = "latest"

[dotfiles]
"~/.bash_profile" = "dotfiles/home/bash_profile"
"~/.bashrc" = "dotfiles/home/bashrc"
"~/.zshrc" = "dotfiles/home/zshrc"
"~/.zprofile" = "dotfiles/home/zprofile"
"~/.zshenv" = "dotfiles/home/zshenv"
"~/.p10k.zsh" = "dotfiles/home/p10k.zsh"
"~/.tmux.conf" = "dotfiles/home/tmux.conf"
"~/.agents" = { source = "dotfiles/agents", mode = "symlink-each" }
"~/.claude" = { source = "dotfiles/claude", mode = "copy" }
"~/.local/bin" = { source = "dotfiles/local-bin", mode = "symlink-each" }
"~/.config" = { source = "dotfiles/config", mode = "symlink-each", exclude = [
  "nvim",
  "shell",
  "ghostty",
] }
"~/.config/nvim" = "dotfiles/config/nvim"
"~/.config/shell" = { source = "dotfiles/config/shell", mode = "symlink-each" }
"~/.config/ghostty" = { source = "dotfiles/config/ghostty", mode = "symlink-each" }
"~/.config/mise/config.toml" = "mise.toml"

[bootstrap.hooks.pre-dotfiles]
run = """
mkdir -p \"$HOME/.local/bin\"
"""

[bootstrap.hooks.post-dotfiles]
run = """
ln -sf ~/.agents/AGENTS.md ~/.pi/agent/AGENTS.md
"""

[tasks.os-bootstrap]
hide = true
run = ":"

[tasks.bootstrap]
description = "Install shared agent skills and Pi packages"
depends = ["os-bootstrap"]
run = [
  { task = "setup-harness-peripherals" },
  { task = "add-universal-skills" },
  { task = "add-claude-plugin" },
  { task = "add-pi-extension" },
]

[tasks.setup-harness-peripherals]
run = """
rtk init -g --agent pi
herdr integration install pi
rtk init -g --agent claude
herdr integration install claude
"""

[tasks.add-universal-skills]
env.AGENTS = "universal claude-code"
env.AGENT_SKILLS = """
JuliusBrussee/caveman --skill caveman
mattpocock/skills --skill research --skill domain-modeling --skill grilling --skill grill-with-docs --skill to-spec --skill tdd --skill implement --skill code-review
"""
file = "{{ cwd }}/scripts/add-agent-skills.sh"

[tasks.add-claude-plugin]
run = """
claude plugin marketplace add DietrichGebert/ponytail
claude plugin install ponytail@ponytail
"""

[tasks.add-pi-extension]
env.PI_PACKAGES = """
npm:pi-web-access
git:github.com/wxiaoyun/pi-herdr-subagents
npm:@juicesharp/rpiv-ask-user-question
git:github.com/DietrichGebert/ponytail
npm:@gotgenes/pi-anthropic-auth
"""
file = "{{ cwd }}/scripts/add-pi-extension.sh"
