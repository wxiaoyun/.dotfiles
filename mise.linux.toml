[settings]
system_packages.managers = ["pacman"]

[bootstrap.packages]
"pacman:git" = "latest"
"pacman:zoxide" = "latest"
"pacman:eza" = "latest"
"pacman:ripgrep" = "latest"
"pacman:jq" = "latest"
"pacman:fzf" = "latest"
"pacman:mise" = "latest"
"pacman:usage" = "latest"
"pacman:fastfetch" = "latest"
"pacman:dua-cli" = "latest"
"pacman:neovim" = "latest"
"pacman:nodejs" = "latest"
"pacman:python" = "latest"
"pacman:rustup" = "latest"
"pacman:ttf-iosevka-nerd" = "latest"

[dotfiles]
"~/.config/**/platform*" = { source = "linux/config/**/platform*" }

[tasks.bootstrap]
file = "bootstrap/install-aur-packages.sh"
